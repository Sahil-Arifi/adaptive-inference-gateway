name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Sync the frozen environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test with coverage
        run: uv run pytest

  docker-smoke:
    name: Docker build and containerized demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build the frozen CPU image
        run: docker build --tag adaptive-inference-gateway:ci .

      - name: Start the containerized smoke gateway
        shell: bash
        run: |
          docker network create inference-gateway-ci
          docker volume create inference-gateway-artifacts
          docker run --detach \
            --name inference-gateway \
            --network inference-gateway-ci \
            --volume inference-gateway-artifacts:/app/artifacts \
            adaptive-inference-gateway:ci \
            inference-gateway serve --config configs/docker-smoke.yaml

          for attempt in {1..60}; do
            if docker exec inference-gateway python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"; then
              exit 0
            fi
            sleep 2
          done
          docker logs inference-gateway
          exit 1

      - name: Run the demo client between containers
        run: |
          docker run --rm \
            --volume inference-gateway-artifacts:/app/artifacts \
            adaptive-inference-gateway:ci \
            inference-gateway make-demo-image /app/artifacts/demo.png
          docker run --rm \
            --network inference-gateway-ci \
            --volume inference-gateway-artifacts:/app/artifacts:ro \
            adaptive-inference-gateway:ci \
            python scripts/demo_client.py /app/artifacts/demo.png \
              --url http://inference-gateway:8000

      - name: Clean up Docker resources
        if: always()
        shell: bash
        run: |
          docker rm --force inference-gateway 2>/dev/null || true
          docker network rm inference-gateway-ci 2>/dev/null || true
          docker volume rm inference-gateway-artifacts 2>/dev/null || true
