model:
  architecture: resnet18
  backend: onnx
  device: cpu
  onnx_path: artifacts/resnet18.onnx

server:
  host: 127.0.0.1
  port: 8000
  max_upload_bytes: 10485760
  max_in_flight_requests: 64
  max_preprocessing_queue_size: 64
  preprocessing_workers: 2
  top_k: 5

scheduler:
  mode: dynamic
  max_batch_size: 16
  max_wait_ms: 2.0
  max_queue_size: 256
  request_timeout_ms: 30000
  inference_workers: 1

observability:
  prometheus: true

benchmark:
  warmup_requests: 25
  requests_per_case: 200
  concurrency:
    - 1
    - 8
    - 32
    - 64

output:
  directory: artifacts
