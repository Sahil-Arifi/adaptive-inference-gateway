model:
  architecture: resnet18
  backend: fake
  device: cpu
  onnx_path: artifacts/resnet18.onnx

server:
  host: 0.0.0.0
  port: 8000
  max_upload_bytes: 10485760
  top_k: 5

scheduler:
  mode: dynamic
  max_batch_size: 8
  max_wait_ms: 2.0
  max_queue_size: 64
  request_timeout_ms: 5000
  inference_workers: 1

observability:
  prometheus: true

benchmark:
  warmup_requests: 0
  requests_per_case: 1
  concurrency:
    - 1
    - 8
    - 32
    - 64

output:
  directory: artifacts
